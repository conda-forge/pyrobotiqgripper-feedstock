schema_version: 1

context:
  version: "3.3.14"

package:
  name: pyrobotiqgripper
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyrobotiqgripper/pyrobotiqgripper-${{ version }}.tar.gz
  sha256: 1e136c23fa1413a92207407c92514643794cd32817d3349615d052882aee938b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - pyrobotiqgripper-joystick = pyrobotiqgripper.joystick_cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - uv-build >=0.9.4,<1.0.0
    - pip
  run:
    - python >=${{ python_min }}
    - pymodbus >=3.12.1
    - pyserial >=3.5
    - numpy >=1.28
    - pygame
    - pynput
    - python-sounddevice

tests:
  - python:
      imports:
        - pyrobotiqgripper
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true
  - script:
      content:
        - pyrobotiqgripper-joystick --help
      env:
        PYNPUT_BACKEND: dummy
    requirements:
      run:
        - python ${{ python_min }}.*
about:
  summary: Python Driver for Robotiq Grippers
  license: MIT
  license_file: LICENSE
  homepage: https://pyrobotiqgripper.readthedocs.io/
  repository: https://github.com/castetsb/pyRobotiqGripper
  documentation: https://pyrobotiqgripper.readthedocs.io/

extra:
  recipe-maintainers:
    - nmarticorena
